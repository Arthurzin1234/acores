services:
  - type: web
    name: acores-central
    runtime: node
    plan: 1c-2g
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo
      - key: BIND_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://acores-five.vercel.app
      - key: PERSISTENT_ROOT
        value: /tmp/acores
      - key: ALLOW_EPHEMERAL_STORAGE
        value: "true"
      - key: DATA_DIR
        value: /tmp/acores/data
      - key: WHATSAPP_AUTH_DIR
        value: /tmp/acores/whatsapp
      - key: INITIAL_ADMIN_EMAIL
        value: acores@gmail.com
      - key: INITIAL_ADMIN_USERNAME
        value: admin123
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: AI_ENCRYPTION_KEY
        sync: false
      - key: WHATSAPP_AUTH_ENCRYPTION_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-3-mini
      - key: WHATSAPP_AUTOSTART
        value: "true"
      - key: WHATSAPP_RESPONSE_DELAY_MS
        value: "1000"
      - key: AI_TIMEOUT_MS
        value: "5000"
      - key: FLOW_ACCESS_PASSWORD
        sync: false
      - key: ENABLE_SIMULATOR
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: MEMORY_ALERT_MB
        value: "1536"
